<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:title" content="AS Level Mathematics">
    <meta property="og:description" content="9709 Past Papers">
    <meta property="og:type" content="website">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Level Mathematics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
            width: 100%;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        /* Birthday Overlay Styles */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fffaeedd; /* Soft festive background */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 1000;
            padding: 20px;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay h2 {
            font-size: 42px;
            color: #e74c3c;
            margin-bottom: 15px;
            animation: pop 0.5s ease-out;
        }
        .overlay p {
            color: #2c3e50;
            font-size: 20px;
            max-width: 400px;
        }
        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- This is the "Disguise" page she will see first -->
    <div class="container" id="main-content">
        <h1>9709 Series</h1>
        <p>Solutions, past papers, mark schemes and examiner reports</p>
        <button class="btn" onclick="revealSurprise()">Open</button>
    </div>

    <!-- The container is empty so mobile apps see no text here -->
    <div class="overlay" id="birthday-overlay">
        <h2 id="surprise-heading"></h2>
        <p id="surprise-text"></p>
    </div>

    <script>
        function revealSurprise() {
            // 1. Inject the text safely at execution time so scrapers can't read it
            document.getElementById('surprise-heading').innerText = "🎉 Happy Birthday, Maliha! 🎂";
            document.getElementById('surprise-text').innerText = "Hope you have an amazing day filled with joy, laughter, and everything you've been wishing for! ✨";
            
            // 2. Smoothly display the hidden birthday overlay
            document.getElementById('birthday-overlay').classList.add('active');
        }
    </script>
</body>
</html>
